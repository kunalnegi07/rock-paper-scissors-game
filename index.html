<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors-Game</title>
    <script src="script.js" defer></script>
    <style>
        .maincontainer{
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: lightgray;
        }
        .maincontainer1{
            display: flex;
            width: 300px;
            height: 400px;
            padding: 40px 32px;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: white;
            border-radius: 24px;
        }
        .btns{
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 16px;
        }
        button{
            height: 50px;
            width: 100px;
        }
        #outcome{
            display: flex;
            justify-content: center;
            align-items: center;
            font-size:24px;
            margin: 20px 0px;
            color: gray;
        }
        #score{
            font-size: 20px;
            margin-bottom: 8px;
            color: gray;
        }
        #result{
            font-size: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .heading{
            font-weight: 900;
            font-size: 32px;
            margin-bottom: 12px;
            color: #374151;
        }

        .para1{
            font-size: 18px;
            margin-bottom: 24px;
            color:  #6b7280;
        }
        .buttons{
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .buttons:hover{
            background-color: #2563eb;
        }
        .buttons:active{
            background-color: #1d4ed8;
        }

        .buttons:disabled{
            background-color: #9ca3af;
        }

        .playagain{
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 24px;
        }

        .playagain:hover{
            background-color: #2563eb;
        }

        .playagain:active{
            background-color: #1d4ed8;
        }

        #game-over-screen{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

    </style>
</head>
<body>
     
    <div class="maincontainer">
        <div class="maincontainer1">
   
            <div class="heading">Rock Paper Scissors</div>

            <p class="para1">First to 5 points wins the game</p>
            <div id="score"></div>
            <div id="result"></div>

        <div class="mainscreen">

            <div class="onscreen">
                <div id="outcome"></div>
            </div>

            <div class="btns">
                <button  class="buttons rock">Rock</button>
                <button  class="buttons paper">Paper</button>
                <button  class="buttons scissors">scissors</button>
            </div>

        </div>

        <div id="game-over-screen" style="display: none;">
            <h1>Game over!</h1>
            <button class="playagain" id="play-again">Play Again</button>
        </div>
    
    </div>
    </div>

    
    
</body>
</html>
